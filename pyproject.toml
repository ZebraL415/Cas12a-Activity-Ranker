[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cas12a-activity-ranker"
version = "2.0.0"
description = "Reproducible toolkit for predicting continuous Cas12a diagnostic activity and ranking sequence pairs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "scikit-learn==1.5.1",
  "xgboost==2.1.4",
  "catboost==1.2.8",
  "lightgbm==4.6.0",
  "joblib==1.4.2",
  "openpyxl==3.1.5",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cas12a-ranker = "cas12a_ml.cli:main"
