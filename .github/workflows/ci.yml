name: test

on:
  push:
    branches: [main, "codex/v1.5-d-ensemble"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and LFS artifacts
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run bundled end-to-end example
        run: cas12a-ranker self-test

      - name: Verify repository artifacts
        env:
          PYTHONPATH: src
        run: python scripts/verify_repository.py

      - name: Verify training contract
        run: python scripts/train_final_four.py --verify-only

      - name: Recompute v1.5 metrics without bootstrap latency
        run: python scripts/reproduce_metrics.py --bootstrap 20
